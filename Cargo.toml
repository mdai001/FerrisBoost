[package]
name = "ferrisboost"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "Column-blocked gradient boosted trees that train directly from Arrow / Parquet / CSV"
homepage = "https://pypi.org/project/ferrisboost/"
readme = "README.md"
keywords = ["gbdt", "boosting", "xgboost", "arrow", "parquet"]
categories = ["science", "algorithms"]
# uv.lock and .gitignore are local development artefacts; they describe this
# checkout rather than the crate, so they stay out of the published package.
exclude = ["uv.lock", ".gitignore"]

[dependencies]
arrow = "53"
parquet = { version = "53", features = ["async"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
blake3 = "1"
# `.csv.gz` 输入。parquet 已经把它拉进依赖树了,所以这里是零新增编译成本。
flate2 = "1"
pyo3 = { version = "0.29.2", default-features = false, features = ["abi3-py39", "macros"], optional = true }
numpy = { version = "0.29.0", optional = true }
cudarc = { version = "0.19.9", default-features = false, features = ["std", "driver", "nvrtc", "fallback-dynamic-loading", "cuda-13030"], optional = true }

[lib]
name = "ferrisboost"
# cdylib 给 Python 扩展,rlib 给 cargo test 和 examples
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
approx = "0.5"

[profile.release]
# 保留符号表给 perf 用,不影响优化
debug = true
lto = true
codegen-units = 1

# 发布 wheel 专用。`release` 刻意带 `debug = true`(nsys / ncu / perf 要符号),
# 但那些符号会把**构建机器的绝对路径**写进 .so:实测未 strip 的 wheel 里有
# 630 处 `/home/<user>`、154 处 rustc 源码路径,.so 解压后 131 MB。
# 发布产物既不需要这些符号,也不该带上构建者的用户名和目录结构。
[profile.dist]
inherits = "release"
debug = false
strip = "symbols"

[features]
# Python 绑定。默认不开:普通 cargo test 不该需要 Python 头文件,
# 而且 extension-module 会让 Python 符号在链接期缺失,单测跑不了。
python = ["dep:pyo3", "dep:numpy"]
# 预编译 PTX 随仓库分发;默认构建不需要 CUDA toolkit 或 driver。
cuda = ["dep:cudarc"]
